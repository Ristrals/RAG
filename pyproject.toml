[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "High-performance CPU-only local RAG system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "mypy>=1.11",
    "fire",
    "torch",
    "transformers",
    "bm25s",
    "sentence-transformers",
    "chromadb",
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
cache-dir = "/media/kmalfois/RistralRemote/Projects/uvcache"